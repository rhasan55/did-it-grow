<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520"><rect width="1000" height="520" fill="#f5f5f0"/><g font-family="sans-serif" fill="#1c2c36"><text x="60" y="55" font-size="15">DID IT GROW? · SIMULATED DATA ONLY</text><text x="60" y="130" font-size="52" font-weight="700">A launch win. A business loss.</text><text x="60" y="183" font-size="22">New offer revenue rises. Existing revenue falls. Service costs remain.</text><path d="M60,225H940" stroke="#aab9bf"/><text x="60" y="270" font-size="17">New offer revenue</text><text x="375" y="270" font-size="17">Existing product revenue</text><text x="710" y="270" font-size="17">Business contribution</text><text x="60" y="335" font-size="54">+$11.40</text><text x="375" y="335" font-size="54">−$11.39</text><text x="710" y="335" font-size="54" fill="#a14420">−$2.27</text><path d="M60,375H940" stroke="#aab9bf"/><text x="60" y="420" font-size="18">USD per baseline-eligible customer per week · cohort DiD vs never-treated markets</text><text x="60" y="463" font-size="17">SQL reporting + causal checks + one deliberately broken comparison</text><text x="60" y="493" font-size="13">Independent example by Raja Hasan. Not an estimate of Intuit performance.</text></g></svg>